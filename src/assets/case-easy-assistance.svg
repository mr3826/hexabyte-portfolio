<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A0A"/>
  <rect x="40" y="40" width="720" height="520" rx="16" stroke="#333333" stroke-width="2" fill="#141414"/>
  
  <!-- Header -->
  <rect x="60" y="60" width="680" height="80" rx="12" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>
  <text x="90" y="105" font-family="Inter" font-size="20" font-weight="600" fill="#EDEDED">Easy Assistance — Workflow</text>
  <text x="90" y="125" font-family="Inter" font-size="14" fill="#A1A1AA">Customer enquiry → AI qualification → Availability check → Booking confirmation → Reminder → Service completion → Follow-up</text>
  
  <!-- Flow Steps -->
  <g font-family="Inter">
    <!-- Step 1: Customer Enquiry -->
    <rect x="80" y="180" width="200" height="100" rx="12" fill="#1A1A1A" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="180" cy="200" r="24" fill="#3B82F6"/>
    <text x="180" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="white">1</text>
    <text x="180" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Customer Enquiry</text>
    <text x="180" y="265" text-anchor="middle" font-size="11" fill="#A1A1AA">Website, WhatsApp,</text>
    <text x="180" y="280" text-anchor="middle" font-size="11" fill="#A1A1AA">Social Messaging</text>
    
    <!-- Arrow 1 -->
    <path d="M280 230 L320 230" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 2: AI Qualification -->
    <rect x="320" y="180" width="200" height="100" rx="12" fill="#1A1A1A" stroke="#6366F1" stroke-width="2"/>
    <circle cx="420" cy="200" r="24" fill="#6366F1"/>
    <text x="420" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="white">2</text>
    <text x="420" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">AI Qualification</text>
    <text x="420" y="265" text-anchor="middle" font-size="11" fill="#A1A1AA">Intent detection,</text>
    <text x="420" y="280" text-anchor="middle" font-size="11" fill="#A1A1AA">detail collection</text>
    
    <!-- Arrow 2 -->
    <path d="M520 230 L560 230" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead2)"/>
    <defs>
      <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 3: Availability Check -->
    <rect x="560" y="180" width="200" height="100" rx="12" fill="#1A1A1A" stroke="#22C55E" stroke-width="2"/>
    <circle cx="660" cy="200" r="24" fill="#22C55E"/>
    <text x="660" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="white">3</text>
    <text x="660" y="245" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Availability Check</text>
    <text x="660" y="265" text-anchor="middle" font-size="11" fill="#A1A1AA">Service, staff,</text>
    <text x="660" y="280" text-anchor="middle" font-size="11" fill="#A1A1AA">location real-time</text>
  </g>
  
  <!-- Row 2 -->
  <g font-family="Inter">
    <!-- Step 4: Booking Confirmation -->
    <rect x="80" y="330" width="200" height="100" rx="12" fill="#1A1A1A" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="180" cy="350" r="24" fill="#3B82F6"/>
    <text x="180" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="white">4</text>
    <text x="180" y="395" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Booking</text>
    <text x="180" y="415" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Confirmation</text>
    <text x="180" y="435" text-anchor="middle" font-size="11" fill="#A1A1AA">Slot confirmed,</text>
    <text x="180" y="450" text-anchor="middle" font-size="11" fill="#A1A1AA">details recorded</text>
    
    <!-- Arrow 3 -->
    <path d="M280 380 L320 380" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead3)"/>
    <defs>
      <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 5: Reminder -->
    <rect x="320" y="330" width="200" height="100" rx="12" fill="#1A1A1A" stroke="#6366F1" stroke-width="2"/>
    <circle cx="420" cy="350" r="24" fill="#6366F1"/>
    <text x="420" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="white">5</text>
    <text x="420" y="395" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Automated</text>
    <text x="420" y="415" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Reminder</text>
    <text x="420" y="435" text-anchor="middle" font-size="11" fill="#A1A1AA">Pre-appointment</text>
    <text x="420" y="450" text-anchor="middle" font-size="11" fill="#A1A1AA">notifications sent</text>
    
    <!-- Arrow 4 -->
    <path d="M520 380 L560 380" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead4)"/>
    <defs>
      <marker id="arrowhead4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 6: Service Completion -->
    <rect x="560" y="330" width="200" height="100" rx="12" fill="#1A1A1A" stroke="#22C55E" stroke-width="2"/>
    <circle cx="660" cy="350" r="24" fill="#22C55E"/>
    <text x="660" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="white">6</text>
    <text x="660" y="395" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Service</text>
    <text x="660" y="415" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Completion</text>
    <text x="660" y="435" text-anchor="middle" font-size="11" fill="#A1A1AA">Staff marks done,</text>
    <text x="660" y="450" text-anchor="middle" font-size="11" fill="#A1A1AA">notes captured</text>
  </g>
  
  <!-- Step 7: Follow-up (centered below) -->
  <g font-family="Inter">
    <rect x="320" y="480" width="200" height="80" rx="12" fill="#1A1A1A" stroke="#EAB308" stroke-width="2"/>
    <circle cx="420" cy="500" r="20" fill="#EAB308"/>
    <text x="420" y="506" text-anchor="middle" font-size="12" font-weight="600" fill="#0A0A0A">7</text>
    <text x="420" y="535" text-anchor="middle" font-size="13" font-weight="500" fill="#EDEDED">Follow-up</text>
    <text x="420" y="552" text-anchor="middle" font-size="11" fill="#A1A1AA">Feedback, rebooking, loyalty</text>
  </g>
  
  <!-- Beta badge -->
  <rect x="600" y="60" width="120" height="32" rx="16" fill="#EAB308" fill-opacity="0.1" stroke="#EAB308" stroke-width="1"/>
  <text x="660" y="83" text-anchor="middle" font-family="Inter" font-size="11" font-weight="600" fill="#EAB308">Beta Testing</text>
</svg>