<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#0A0A0A"/>
  <rect x="40" y="40" width="720" height="520" rx="16" stroke="#333333" stroke-width="2" fill="#141414"/>
  
  <!-- Header -->
  <rect x="60" y="60" width="680" height="80" rx="12" fill="#1A1A1A" stroke="#333333" stroke-width="1"/>
  <text x="90" y="105" font-family="Inter" font-size="20" font-weight="600" fill="#EDEDED">Easy E-commerce — Workflow</text>
  <text x="90" y="125" font-family="Inter" font-size="14" fill="#A1A1AA">Describe business → AI drafts store → Merchant customizes → Publish → Receive orders → Payment/COD → Courier fulfilment → Growth analytics</text>
  
  <!-- Flow Steps Row 1 -->
  <g font-family="Inter">
    <!-- Step 1: Describe Business -->
    <rect x="60" y="180" width="170" height="100" rx="12" fill="#1A1A1A" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="145" cy="200" r="24" fill="#3B82F6"/>
    <text x="145" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="white">1</text>
    <text x="145" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Describe</text>
    <text x="145" y="260" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Business</text>
    <text x="145" y="278" text-anchor="middle" font-size="10" fill="#A1A1AA">Merchant describes</text>
    <text x="145" y="292" text-anchor="middle" font-size="10" fill="#A1A1AA">products & target</text>
    
    <!-- Arrow 1 -->
    <path d="M230 230 L255 230" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 2: AI Drafts Store -->
    <rect x="255" y="180" width="170" height="100" rx="12" fill="#1A1A1A" stroke="#6366F1" stroke-width="2"/>
    <circle cx="340" cy="200" r="24" fill="#6366F1"/>
    <text x="340" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="white">2</text>
    <text x="340" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">AI Drafts</text>
    <text x="340" y="260" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Store</text>
    <text x="340" y="278" text-anchor="middle" font-size="10" fill="#A1A1AA">Structure, categories,</text>
    <text x="340" y="292" text-anchor="middle" font-size="10" fill="#A1A1AA">initial copy</text>
    
    <!-- Arrow 2 -->
    <path d="M425 230 L450 230" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead2)"/>
    <defs>
      <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 3: Merchant Customizes -->
    <rect x="450" y="180" width="170" height="100" rx="12" fill="#1A1A1A" stroke="#22C55E" stroke-width="2"/>
    <circle cx="535" cy="200" r="24" fill="#22C55E"/>
    <text x="535" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="white">3</text>
    <text x="535" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Merchant</text>
    <text x="535" y="260" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Customizes</text>
    <text x="535" y="278" text-anchor="middle" font-size="10" fill="#A1A1AA">Theme, layout,</text>
    <text x="535" y="292" text-anchor="middle" font-size="10" fill="#A1A1AA">branding, content</text>
    
    <!-- Arrow 3 -->
    <path d="M620 230 L645 230" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead3)"/>
    <defs>
      <marker id="arrowhead3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 4: Publish -->
    <rect x="645" y="180" width="120" height="100" rx="12" fill="#1A1A1A" stroke="#EAB308" stroke-width="2"/>
    <circle cx="705" cy="200" r="24" fill="#EAB308"/>
    <text x="705" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">4</text>
    <text x="705" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Publish</text>
    <text x="705" y="260" text-anchor="middle" font-size="10" fill="#A1A1AA">Custom domain,</text>
    <text x="705" y="274" text-anchor="middle" font-size="10" fill="#A1A1AA">SSL, mobile</text>
    <text x="705" y="288" text-anchor="middle" font-size="10" fill="#A1A1AA">optimized</text>
  </g>
  
  <!-- Row 2 -->
  <g font-family="Inter">
    <!-- Step 5: Receive Orders -->
    <rect x="60" y="330" width="170" height="100" rx="12" fill="#1A1A1A" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="145" cy="350" r="24" fill="#3B82F6"/>
    <text x="145" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="white">5</text>
    <text x="145" y="392" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Receive</text>
    <text x="145" y="410" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Orders</text>
    <text x="145" y="428" text-anchor="middle" font-size="10" fill="#A1A1AA">Unified dashboard</text>
    <text x="145" y="442" text-anchor="middle" font-size="10" fill="#A1A1AA">with customer details</text>
    
    <!-- Arrow 4 -->
    <path d="M230 380 L255 380" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead4)"/>
    <defs>
      <marker id="arrowhead4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 6: Payment/COD -->
    <rect x="255" y="330" width="170" height="100" rx="12" fill="#1A1A1A" stroke="#6366F1" stroke-width="2"/>
    <circle cx="340" cy="350" r="24" fill="#6366F1"/>
    <text x="340" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="white">6</text>
    <text x="340" y="392" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Payment / COD</text>
    <text x="340" y="410" text-anchor="middle" font-size="10" fill="#A1A1AA">bKash, Nagad,</text>
    <text x="340" y="424" text-anchor="middle" font-size="10" fill="#A1A1AA">card, cash on</text>
    <text x="340" y="438" text-anchor="middle" font-size="10" fill="#A1A1AA">delivery</text>
    
    <!-- Arrow 5 -->
    <path d="M425 380 L450 380" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead5)"/>
    <defs>
      <marker id="arrowhead5" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 7: Courier Fulfilment -->
    <rect x="450" y="330" width="170" height="100" rx="12" fill="#1A1A1A" stroke="#22C55E" stroke-width="2"/>
    <circle cx="535" cy="350" r="24" fill="#22C55E"/>
    <text x="535" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="white">7</text>
    <text x="535" y="392" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Courier</text>
    <text x="535" y="410" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Fulfilment</text>
    <text x="535" y="428" text-anchor="middle" font-size="10" fill="#A1A1AA">Pathao, Steadfast,</text>
    <text x="535" y="442" text-anchor="middle" font-size="10" fill="#A1A1AA">RedX integration</text>
    
    <!-- Arrow 6 -->
    <path d="M620 380 L645 380" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead6)"/>
    <defs>
      <marker id="arrowhead6" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333333"/>
      </marker>
    </defs>
    
    <!-- Step 8: Growth Analytics -->
    <rect x="645" y="330" width="120" height="100" rx="12" fill="#1A1A1A" stroke="#EAB308" stroke-width="2"/>
    <circle cx="705" cy="350" r="24" fill="#EAB308"/>
    <text x="705" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">8</text>
    <text x="705" y="392" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Growth</text>
    <text x="705" y="410" text-anchor="middle" font-size="12" font-weight="500" fill="#EDEDED">Analytics</text>
    <text x="705" y="428" text-anchor="middle" font-size="10" fill="#A1A1AA">Conversion, revenue,</text>
    <text x="705" y="442" text-anchor="middle" font-size="10" fill="#A1A1AA">customer metrics</text>
  </g>
  
  <!-- Beta badge -->
  <rect x="600" y="60" width="120" height="32" rx="16" fill="#EAB308" fill-opacity="0.1" stroke="#EAB308" stroke-width="1"/>
  <text x="660" y="83" text-anchor="middle" font-family="Inter" font-size="11" font-weight="600" fill="#EAB308">Beta Testing</text>
</svg>