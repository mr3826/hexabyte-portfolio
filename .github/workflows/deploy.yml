name: Deploy hexabyte.tech

# The live site is CloudFront E1QPRQT12IQGL9 in front of the S3 bucket
# hexabyte-tech-website. This workflow previously triggered an AWS Amplify build
# instead, which stopped affecting the live site when CloudFront was repointed at S3 —
# and swallowed the resulting API error with `|| exit 0`, so six consecutive runs
# reported success while changing nothing. Nothing here is allowed to fail quietly.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Needed to mint the OIDC token that hexabyte-site-deploy trusts.
permissions:
  id-token: write
  contents: read

env:
  AWS_DEFAULT_REGION: ap-south-1
  BUCKET: hexabyte-tech-website
  DISTRIBUTION_ID: E1QPRQT12IQGL9
  SITE_URL: https://hexabyte.tech

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Short-lived credentials from a role scoped to this one bucket and this one
      # distribution. The static keys this replaced belonged to cli-admin, the
      # account's only IAM user, which holds AdministratorAccess — a leaked CI secret
      # was an account takeover rather than a defaced website. The role's trust policy
      # only accepts tokens from refs/heads/main of this repository.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::899628690531:role/hexabyte-site-deploy
          aws-region: ap-south-1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gates. A broken build must never reach the bucket.
      - run: npm run typecheck
      - run: npm test -- --run

      # Vite inlines VITE_* at build time, so these must be present HERE. Setting
      # them in .env.production does nothing: that file is gitignored, so CI never
      # sees it — which is how the site shipped for weeks with an unset endpoint
      # and a form that quietly fell back to mailto:.
      #
      # `vars`, not `secrets`: both values are compiled into client JS and served
      # to every visitor, so they are public by construction. Keeping them as
      # variables means you can read them back in the log and confirm what shipped.
      - run: npm run build
        env:
          VITE_FORM_SUBMISSION_ENDPOINT: ${{ vars.VITE_FORM_SUBMISSION_ENDPOINT }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}

      # A variable that is set but misspelled, or read under a different name in
      # the source, produces a green deploy and a dead form. Prove the value
      # actually reached the bundle.
      - name: Confirm build-time config reached the bundle
        env:
          ENDPOINT: ${{ vars.VITE_FORM_SUBMISSION_ENDPOINT }}
          GTM_ID: ${{ vars.VITE_GTM_ID }}
        run: |
          if [ -n "$ENDPOINT" ]; then
            grep -rqF "$ENDPOINT" dist/assets/*.js || {
              echo "VITE_FORM_SUBMISSION_ENDPOINT is set but is not in the bundle."
              echo "The form would fall back to mailto: on the live site."
              exit 1
            }
            echo "ok   inquiry endpoint is in the bundle"
          else
            echo "note VITE_FORM_SUBMISSION_ENDPOINT is unset — the form will offer"
            echo "     a prefilled email instead. See docs/DEPLOYMENT.md."
          fi

          if [ -n "$GTM_ID" ]; then
            grep -qF "$GTM_ID" dist/index.html || {
              echo "VITE_GTM_ID is set but no tag was injected into dist/index.html."
              exit 1
            }
            echo "ok   analytics container $GTM_ID is in the page"
          else
            echo "note VITE_GTM_ID is unset — no analytics tag is being shipped."
          fi

      # Hashed filenames, so they can be cached for a year.
      - name: Upload immutable assets
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      # Everything else must revalidate, or a deploy takes a day to become visible.
      # prerendered.json and __prerender/ are build plumbing, not public files.
      - name: Upload documents
        run: |
          aws s3 sync dist "s3://$BUCKET" \
            --delete \
            --exclude "assets/*" \
            --exclude "prerendered.json" \
            --exclude "__prerender/*" \
            --cache-control "public, max-age=0, must-revalidate"

      # Route files are staged flat on disk and uploaded to their real keys here, with
      # an explicit content type: the keys have no extension (CloudFront fronts an S3
      # REST origin, so /products is the key `products`), and S3 would otherwise serve
      # them as application/octet-stream — a download prompt instead of a page.
      # Runs after the sync above, whose --delete removes these keys first.
      - name: Upload prerendered routes
        run: |
          jq -r '.[] | "\(.file)\t\(.key)"' dist/prerendered.json |
          while IFS=$'\t' read -r file key; do
            aws s3 cp "dist/$file" "s3://$BUCKET/$key" \
              --content-type "text/html; charset=utf-8" \
              --cache-control "public, max-age=0, must-revalidate"
          done

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "Invalidation $ID created"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$ID"

      # Proves the deploy actually reached the public URL. Without this a run can only
      # report that AWS accepted the calls — which is how the previous version managed
      # to print "hexabyte.tech is live" over months-old content.
      - name: Verify the live site serves this build
        run: |
          fail=0
          check() {
            path="$1"; expected="$2"
            live=$(curl -fsS "$SITE_URL$path" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//')
            if [ "$live" = "$expected" ]; then
              echo "ok   $path — $live"
            else
              echo "FAIL $path"
              echo "  expected: $expected"
              echo "  live:     $live"
              fail=1
            fi
          }

          check "/" "$(jq -r '.routes["/"].title' src/data/seo.json)"
          check "/products" "$(jq -r '.routes["/products"].title' src/data/seo.json)"
          check "/case-studies/easy-moderator" "$(jq -r '.caseStudies["easy-moderator"].title' src/data/seo.json)"

          type=$(curl -fsSI "$SITE_URL/og-image.png" | tr -d '\r' | awk -F': ' '/^content-type:/ {print $2}')
          if [ "$type" = "image/png" ]; then
            echo "ok   /og-image.png — $type"
          else
            echo "FAIL /og-image.png served as '$type' — that is the SPA fallback, not the image"
            fail=1
          fi

          exit $fail
