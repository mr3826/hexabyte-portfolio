<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Crawlers and social scrapers that do not run JS see only this head, so it
         must match the homepage metadata that RouteObserver sets in App.tsx. -->
    <title>Hexabyte Technologies | Automate the Work That Eats Your Day</title>
    <meta
      name="description"
      content="We build the systems that answer your customers, capture orders, book deliveries and keep the numbers straight — so your team stops doing it by hand."
    />
    <link rel="canonical" href="https://hexabyte.tech/" />

    <link rel="icon" type="image/png" href="/hexabyte-logo.png" />
    <link rel="apple-touch-icon" href="/hexabyte-logo.png" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Loaded here rather than @import-ed from the CSS bundle: an @import cannot
         be requested until that bundle has downloaded and parsed, which puts the
         font two round trips behind first paint. Weights are only the ones the
         site uses — Inter 400/500/600/700, JetBrains Mono 400/500. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hexabyte Technologies" />
    <meta property="og:url" content="https://hexabyte.tech/" />
    <meta
      property="og:title"
      content="Hexabyte Technologies | Automate the Work That Eats Your Day"
    />
    <meta
      property="og:description"
      content="We build the systems that answer your customers, capture orders, book deliveries and keep the numbers straight — so your team stops doing it by hand."
    />
    <meta property="og:image" content="https://hexabyte.tech/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Hexabyte Technologies | Automate the Work That Eats Your Day"
    />
    <meta
      name="twitter:description"
      content="We build the systems that answer your customers, capture orders, book deliveries and keep the numbers straight — so your team stops doing it by hand."
    />
    <meta name="twitter:image" content="https://hexabyte.tech/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
